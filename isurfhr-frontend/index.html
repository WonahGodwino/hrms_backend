<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<!-- Viewport -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />

		<!-- Primary SEO -->
		<title>24/7 HR</title>
		<meta
			name="title"
			content="24/7 HR" />
		<meta
			name="description"
			content="24/7 HR helps businesses manage HR operations, employees, and productivity with powerful tools." />

		<!-- Favicon -->
		<link
			rel="icon"
			type="image/png"
			href="/favicon-96x96.png"
			sizes="96x96" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg" />
		<link
			rel="shortcut icon"
			href="/favicon.ico" />

		<!-- Apple -->
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/apple-touch-icon.png" />
		<meta
			name="apple-mobile-web-app-title"
			content="247 HR" />

		<!-- OpenGraph (Facebook, WhatsApp, LinkedIn etc) -->
		<meta
			property="og:type"
			content="website" />
		<meta
			property="og:title"
			content="24/7 HR" />
		<meta
			property="og:description"
			content="Manage employees, HR operations and productivity with 24/7 HR." />
		<meta
			property="og:image"
			content="https://yourdomain.com/og-image.png" />
		<meta
			property="og:url"
			content="https://yourdomain.com" />
		<meta
			property="og:site_name"
			content="24/7 HR" />

		<!-- Twitter -->
		<meta
			name="twitter:card"
			content="summary_large_image" />
		<meta
			name="twitter:title"
			content="24/7 HR" />
		<meta
			name="twitter:description"
			content="Manage employees, HR operations and productivity with 24/7 HR." />
		<meta
			name="twitter:image"
			content="https://yourdomain.com/og-image.png" />

		<meta
			name="robots"
			content="index, follow" />

		<meta
			name="theme-color"
			content="#ffffff" />

		<link
			rel="canonical"
			href="https://247hr.co.uk" />
	</head>

	<body>
		<div id="root"></div>

		<script
			type="module"
			src="/src/main.jsx"></script>
	</body>
</html>
